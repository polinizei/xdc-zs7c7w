<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta name="referrer" content="no-referrer"><title>Impressum</title><style>:root{--bar:#2b2f33;--bar-ink:#f2f3f4;--bg:#ffffff;--card:#ffffff;--ink:#1b1f24;--muted:#6b7280;--line:#d9dcdf;--accent:#ea580c;--accent-ink:#fff;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Roboto Condensed","Arial Narrow",system-ui,sans-serif;font-stretch:condensed}.bar{background:var(--bar);color:var(--bar-ink);padding-top:env(safe-area-inset-top,0)}.bar .in{max-width:760px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{color:#fff;text-decoration:none;font-weight:700;letter-spacing:.5px}.brand b{color:var(--accent)}.lang{display:flex;gap:4px}.lang button{background:0 0;border:0;border-bottom:2px solid transparent;color:#c9cdd1;font:inherit;font-weight:700;letter-spacing:.08em;font-size:13px;min-height:40px;padding:4px 8px;cursor:pointer}.lang button[aria-pressed=true]{color:#fff;border-bottom-color:var(--accent)}.wrap{max-width:760px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:14px}h1{font-size:24px;line-height:1.15;margin:0;text-transform:uppercase;letter-spacing:.02em}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.card h2{font-size:18px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.02em}.card h3{font-size:15px;margin:16px 0 4px}.card p{margin:0 0 8px;font-size:15px}.muted{color:var(--muted);font-size:14px}a{color:var(--accent)}address{font-style:normal;white-space:pre-line}.back{justify-self:start;display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none}</style></head><body><header class="bar"><div class="in"><a class="brand" href="./"><b>X</b>DC · Dyno Compare</a><div class="lang" id="lang"><button data-l="de">DE</button><button data-l="en">EN</button><button data-l="it">IT</button><button data-l="fr">FR</button><button data-l="es">ES</button></div></div></header><div class="wrap"><h1 id="h"></h1><p class="muted" id="mt" hidden></p><section class="card" id="imp"></section><section class="card" id="ds"></section><a class="back" id="back" href="./"></a></div><script>const K={f:[116,114,111,112,115,110,110,101,82,32,114,101,103,121,88],n:[97,119,105,100,97,108,75,32,108,101,97,104,99,105,77],s:[97,50,51,32,114,101,103,110,65,32,109,65],o:[110,101,115,117,97,104,108,104,252,77,32,84,79,32,103,110,105,102,102,65,32,52,52,52,54,56],m:[109,111,99,46,108,105,97,109,103,64,114,101,103,121,120,46,108,97,116,114,111,112]},D=e=>String.fromCharCode(...K[e].slice().reverse()),T={de:{h:"Impressum & Datenschutz",imp:"Impressum",law:"Angaben gemäß § 5 DDG",contact:"Kontakt",mail:"E-Mail",resp:"Verantwortlich für den Inhalt (§ 18 Abs. 2 MStV)",respT:"wie oben",odr:"Streitbeilegung",odrT:"Zur Teilnahme an Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle sind wir nicht verpflichtet und nicht bereit.",country:"Deutschland",liab:"Hinweis zu den Ergebnissen",liabT:"Das Werkzeug digitalisiert Kurven aus Fotos, Screenshots und PDFs. Die ermittelten Werte sind Näherungen und hängen von Bildqualität, Entzerrung und Kalibrierung ab. Sie ersetzen keine Messung auf dem Prüfstand. Marken und Bezeichnungen von Prüfstandsherstellern dienen nur zur Beschreibung des Ausdruck-Formats, es besteht keine Verbindung zu den Herstellern.",ds:"Datenschutzerklärung",ctrl:"Verantwortlicher",ctrlT:"siehe Impressum.",host:"Hosting",hostT:"Diese Seite wird bei GitHub Pages (GitHub Inc., 88 Colin P. Kelly Jr. St., San Francisco, CA 94107, USA) gehostet. Beim Aufruf verarbeitet GitHub technisch notwendige Daten wie IP-Adresse, Zeitpunkt, aufgerufene Seite und Browsertyp in Server-Logs. Rechtsgrundlage ist unser berechtigtes Interesse an einem sicheren Betrieb (Art. 6 Abs. 1 lit. f DSGVO). Die Übermittlung in die USA stützt sich auf das EU-US Data Privacy Framework, dem GitHub angehört.",hostL:"Datenschutzhinweise von GitHub",tool:"Werkzeug",toolT:'Fotos, Screenshots und PDFs, die du lädst oder mit der Kamera aufnimmst, werden ausschließlich in deinem Browser verarbeitet und nicht an uns oder Dritte übertragen. Die erfassten Kurven, deren Namen und deine Einstellungen (Einheit, Ansicht, Hell/Dunkel, Report) werden lokal in deinem Browser gespeichert (localStorage), damit sie beim nächsten Aufruf noch da sind. Für den Vergleich mit dem Original wird das ausgerichtete Bild lokal in deinem Browser gespeichert (IndexedDB) und mit den Kurven gelöscht. Es verlässt dein Gerät nicht. Für den Offline-Betrieb legt der Browser die Programmdateien in einem lokalen Zwischenspeicher ab. Du kannst alle Daten jederzeit über "Alle Kurven löschen" oder die Browser-Einstellungen entfernen. Es werden keine Cookies gesetzt, keine Analysedienste und keine externen Inhalte eingesetzt.',cam:"Kamera",camT:'Die Kamera wird nur geöffnet, wenn du "Foto aufnehmen" antippst, und nur über die Kamera-Funktion deines Geräts. Das Foto bleibt auf deinem Gerät.',pf:"Projektdatei",pfT:'"Projekt speichern" erzeugt eine Datei (.xdc) mit deinen Kurven, Laufnamen, Höchstwert-Ankern und Report-Einstellungen. Sie entsteht in deinem Browser. Du speicherst sie selbst oder gibst sie über das Teilen-Menü deines Geräts weiter, wohin du willst. Standardmäßig enthält sie keine Bilder. Wählst du "Mit Bildern", kommen die ausgerichteten Originalbilder dazu. Sie können Kundendaten zeigen, deshalb gibst du die Datei nur weiter, wenn das in Ordnung ist. "Projekt öffnen" liest eine solche Datei lokal in deinem Browser ein und prüft sie vorher auf Aufbau, Größe und Inhalt. Dabei wird nichts an uns oder Dritte übertragen und kein Inhalt der Datei ausgeführt.',sh:"Teilen an XDC",shT:"Auf Geräten, die das unterstützen (zum Beispiel Android mit installierter App), erscheint XDC im Teilen-Menü anderer Apps. Ein geteiltes Bild oder PDF wird an die App auf deinem Gerät übergeben: Der Service Worker legt es kurz im lokalen Zwischenspeicher deines Browsers ab, die App lädt es in die Analyse und löscht es danach dort wieder. Die Übergabe bleibt auf deinem Gerät, es gibt keine Übertragung an einen Server.",cb:"Zwischenablage, Ziehen und Ablegen",cbT:'Wenn du ein Bild einfügst (Strg+V) oder eine Datei auf die Seite ziehst, wird sie nur in deinem Browser verarbeitet und nicht übertragen. XDC liest die Zwischenablage nur in dem Moment, in dem du selbst einfügst, nie im Hintergrund. "Bild in Zwischenablage" schreibt das fertige Diagramm nur auf deinen Wunsch in die Zwischenablage deines Geräts.',em:"E-Mail",emT:"Wenn du uns per E-Mail schreibst, verwenden wir deine Angaben nur zur Bearbeitung deiner Anfrage. Unser Postfach liegt bei Google (Gmail, Google Ireland Ltd.). Dabei können Daten in die USA übermittelt werden, gestützt auf das EU-US Data Privacy Framework.",rights:"Deine Rechte",rightsT:"Auskunft, Berichtigung, Löschung, Einschränkung, Widerspruch und Beschwerde bei einer Aufsichtsbehörde (Art. 15 bis 21, 77 DSGVO). Kontakt siehe Impressum.",back:"Zurück zum Werkzeug"},en:{h:"Legal notice & privacy",imp:"Legal notice",law:"Information pursuant to § 5 DDG (German Digital Services Act)",contact:"Contact",mail:"E-mail",resp:"Responsible for content (§ 18 (2) MStV)",respT:"as above",odr:"Dispute resolution",odrT:"We are neither obliged nor willing to take part in dispute resolution proceedings before a consumer arbitration board.",country:"Germany",liab:"Note on results",liabT:"This tool digitises curves from photos, screenshots and PDFs. The values obtained are approximations and depend on image quality, rectification and calibration. They do not replace a measurement on a dyno. Brand names of dyno manufacturers are only used to describe the printout format; there is no affiliation with the manufacturers.",ds:"Privacy policy",ctrl:"Controller",ctrlT:"see legal notice.",host:"Hosting",hostT:"This site is hosted on GitHub Pages (GitHub Inc., 88 Colin P. Kelly Jr. St., San Francisco, CA 94107, USA). When you visit, GitHub processes technically necessary data such as IP address, time, page requested and browser type in server logs. The legal basis is our legitimate interest in secure operation (Art. 6 (1) (f) GDPR). Transfer to the USA relies on the EU-US Data Privacy Framework, which GitHub participates in.",hostL:"GitHub privacy statement",tool:"Tool",toolT:'Photos, screenshots and PDFs you load or take with the camera are processed exclusively in your browser and are not transmitted to us or third parties. The captured curves, their names and your settings (unit, view, light/dark, report) are stored locally in your browser (localStorage) so they are still there next time. For the comparison with the original, the aligned image is stored locally in your browser (IndexedDB) and deleted together with its curves. It never leaves your device. For offline use the browser keeps the program files in a local cache. You can remove all data at any time via "Delete all curves" or your browser settings. No cookies are set and no analytics services or external content are used.',cam:"Camera",camT:'The camera is only opened when you tap "Take photo", and only through your device\'s camera function. The photo stays on your device.',pf:"Project file",pfT:'"Save project" creates a file (.xdc) with your curves, run names, peak anchors and report settings. It is created in your browser. You save it yourself or pass it on through your device\'s share menu, wherever you like. By default it contains no images. If you choose "With images", the aligned original images are added. They may show customer data, so only pass the file on if that is fine. "Open project" reads such a file locally in your browser and checks its structure, size and content first. Nothing is transmitted to us or third parties and no content of the file is executed.',sh:"Share to XDC",shT:"On devices that support it (for example Android with the app installed), XDC appears in the share menu of other apps. A shared image or PDF is handed to the app on your device: the service worker briefly stores it in your browser's local cache, the app loads it into the analysis and then deletes it there. The hand-over stays on your device, nothing is transmitted to a server.",cb:"Clipboard, drag and drop",cbT:'When you paste an image (Ctrl+V) or drag a file onto the page, it is processed only in your browser and not transmitted. XDC reads the clipboard only at the moment you paste yourself, never in the background. "Image to clipboard" writes the finished chart to your device\'s clipboard only when you ask for it.',em:"E-mail",emT:"If you e-mail us, we use your details solely to process your request. Our mailbox is hosted by Google (Gmail, Google Ireland Ltd.). Data may be transferred to the USA on the basis of the EU-US Data Privacy Framework.",rights:"Your rights",rightsT:"Access, rectification, erasure, restriction, objection and the right to lodge a complaint with a supervisory authority (Art. 15 to 21, 77 GDPR). Contact: see legal notice.",back:"Back to the tool"},it:{mt:"Traduzione automatica, da far rileggere. Fa fede la versione tedesca.",h:"Note legali e privacy",imp:"Note legali",law:"Informazioni ai sensi del § 5 DDG (legge tedesca sui servizi digitali)",contact:"Contatto",mail:"E-mail",resp:"Responsabile dei contenuti (§ 18 comma 2 MStV)",respT:"come sopra",odr:"Risoluzione delle controversie",odrT:"Non siamo obbligati né disposti a partecipare a procedimenti di risoluzione delle controversie davanti a un organismo di conciliazione dei consumatori.",country:"Germania",liab:"Avvertenza sui risultati",liabT:"Lo strumento digitalizza le curve da foto, screenshot e PDF. I valori ottenuti sono approssimazioni e dipendono dalla qualità dell'immagine, dal raddrizzamento e dalla calibrazione. Non sostituiscono una misura al banco prova. I marchi e le denominazioni dei produttori di banchi prova servono solo a descrivere il formato della stampa, non esiste alcun legame con i produttori.",ds:"Informativa sulla privacy",ctrl:"Titolare del trattamento",ctrlT:"vedi note legali.",host:"Hosting",hostT:"Questo sito è ospitato su GitHub Pages (GitHub Inc., 88 Colin P. Kelly Jr. St., San Francisco, CA 94107, USA). Alla visita GitHub elabora dati tecnicamente necessari come indirizzo IP, ora, pagina richiamata e tipo di browser nei log del server. La base giuridica è il nostro legittimo interesse a un funzionamento sicuro (art. 6 par. 1 lett. f GDPR). Il trasferimento negli USA si basa sul EU-US Data Privacy Framework, al quale GitHub aderisce.",hostL:"Informativa sulla privacy di GitHub",tool:"Strumento",toolT:"Foto, screenshot e PDF che carichi o scatti con la fotocamera vengono elaborati esclusivamente nel tuo browser e non vengono trasmessi a noi né a terzi. Le curve rilevate, i loro nomi e le tue impostazioni (unità, vista, chiaro/scuro, report) vengono salvati localmente nel tuo browser (localStorage), così al prossimo accesso sono ancora presenti. Per il confronto con l'originale l'immagine allineata viene salvata localmente nel tuo browser (IndexedDB) e cancellata insieme alle curve. Non lascia il tuo dispositivo. Per l'uso offline il browser conserva i file del programma in una cache locale. Puoi eliminare tutti i dati in qualsiasi momento con \"Elimina tutte le curve\" o dalle impostazioni del browser. Non vengono impostati cookie e non vengono usati servizi di analisi né contenuti esterni.",cam:"Fotocamera",camT:'La fotocamera viene aperta solo quando tocchi "Scatta foto" e solo tramite la funzione fotocamera del tuo dispositivo. La foto resta sul tuo dispositivo.',pf:"File di progetto",pfT:'"Salva progetto" crea un file (.xdc) con le tue curve, i nomi delle misure, gli ancoraggi dei valori massimi e le impostazioni del report. Viene creato nel tuo browser. Lo salvi tu stesso o lo inoltri con il menu di condivisione del tuo dispositivo, dove vuoi. Per impostazione predefinita non contiene immagini. Se scegli "Con immagini", vengono aggiunte le immagini originali allineate. Possono mostrare dati dei clienti, quindi inoltra il file solo se va bene. "Apri progetto" legge un tale file localmente nel tuo browser e ne verifica prima struttura, dimensione e contenuto. Non viene trasmesso nulla a noi o a terzi e nessun contenuto del file viene eseguito.',sh:"Condividi con XDC",shT:"Sui dispositivi che lo supportano (ad esempio Android con l'app installata) XDC compare nel menu di condivisione di altre app. Un'immagine o un PDF condiviso viene consegnato all'app sul tuo dispositivo: il service worker lo conserva brevemente nella cache locale del tuo browser, l'app lo carica nell'analisi e poi lo cancella da lì. La consegna resta sul tuo dispositivo, non c'è alcuna trasmissione a un server.",cb:"Appunti, trascinamento e rilascio",cbT:'Quando incolli un\'immagine (Ctrl+V) o trascini un file sulla pagina, viene elaborata solo nel tuo browser e non trasmessa. XDC legge gli appunti solo nel momento in cui incolli tu stesso, mai in background. "Immagine negli appunti" scrive il diagramma finito negli appunti del tuo dispositivo solo su tua richiesta.',em:"E-mail",emT:"Se ci scrivi per e-mail, usiamo i tuoi dati solo per elaborare la tua richiesta. La nostra casella di posta si trova presso Google (Gmail, Google Ireland Ltd.). In tal caso i dati possono essere trasferiti negli USA, sulla base del EU-US Data Privacy Framework.",rights:"I tuoi diritti",rightsT:"Accesso, rettifica, cancellazione, limitazione, opposizione e reclamo a un'autorità di controllo (art. 15-21, 77 GDPR). Contatto: vedi note legali.",back:"Torna allo strumento"},fr:{mt:"Traduction automatique, à faire relire. La version allemande fait foi.",h:"Mentions légales et confidentialité",imp:"Mentions légales",law:"Informations selon le § 5 DDG (loi allemande sur les services numériques)",contact:"Contact",mail:"E-mail",resp:"Responsable du contenu (§ 18 al. 2 MStV)",respT:"comme ci-dessus",odr:"Règlement des litiges",odrT:"Nous ne sommes ni tenus ni disposés à participer à une procédure de règlement des litiges devant un organisme de médiation de la consommation.",country:"Allemagne",liab:"Remarque sur les résultats",liabT:"L'outil numérise des courbes à partir de photos, de captures d'écran et de PDF. Les valeurs obtenues sont des approximations et dépendent de la qualité de l'image, du redressement et de l'étalonnage. Elles ne remplacent pas une mesure sur banc d'essai. Les marques et désignations des fabricants de bancs d'essai servent uniquement à décrire le format d'impression, il n'existe aucun lien avec les fabricants.",ds:"Politique de confidentialité",ctrl:"Responsable du traitement",ctrlT:"voir mentions légales.",host:"Hébergement",hostT:"Ce site est hébergé chez GitHub Pages (GitHub Inc., 88 Colin P. Kelly Jr. St., San Francisco, CA 94107, USA). Lors de la visite, GitHub traite des données techniquement nécessaires telles que l'adresse IP, l'heure, la page consultée et le type de navigateur dans les journaux du serveur. La base juridique est notre intérêt légitime à un fonctionnement sûr (art. 6 par. 1 lit. f RGPD). Le transfert vers les États-Unis repose sur le EU-US Data Privacy Framework, auquel GitHub adhère.",hostL:"Déclaration de confidentialité de GitHub",tool:"Outil",toolT:"Les photos, captures d'écran et PDF que vous chargez ou prenez avec l'appareil photo sont traités exclusivement dans votre navigateur et ne sont transmis ni à nous ni à des tiers. Les courbes relevées, leurs noms et vos réglages (unité, affichage, clair/sombre, rapport) sont enregistrés localement dans votre navigateur (localStorage) afin d'être encore là à la prochaine visite. Pour la comparaison avec l'original, l'image alignée est enregistrée localement dans votre navigateur (IndexedDB) et supprimée avec ses courbes. Elle ne quitte pas votre appareil. Pour l'utilisation hors ligne, le navigateur conserve les fichiers du programme dans un cache local. Vous pouvez supprimer toutes les données à tout moment via « Supprimer toutes les courbes » ou les réglages du navigateur. Aucun cookie n'est déposé et aucun service d'analyse ni contenu externe n'est utilisé.",cam:"Appareil photo",camT:"L'appareil photo n'est ouvert que lorsque vous touchez « Prendre une photo », et uniquement via la fonction appareil photo de votre appareil. La photo reste sur votre appareil.",pf:"Fichier de projet",pfT:"« Enregistrer le projet » crée un fichier (.xdc) avec vos courbes, les noms des essais, les ancrages des valeurs maximales et les réglages du rapport. Il est créé dans votre navigateur. Vous l'enregistrez vous-même ou le transmettez via le menu de partage de votre appareil, où vous voulez. Par défaut il ne contient pas d'images. Si vous choisissez « Avec images », les images originales alignées sont ajoutées. Elles peuvent montrer des données de clients, ne transmettez donc le fichier que si cela convient. « Ouvrir le projet » lit un tel fichier localement dans votre navigateur et vérifie d'abord sa structure, sa taille et son contenu. Rien n'est transmis à nous ni à des tiers et aucun contenu du fichier n'est exécuté.",sh:"Partager vers XDC",shT:"Sur les appareils qui le permettent (par exemple Android avec l'application installée), XDC apparaît dans le menu de partage d'autres applications. Une image ou un PDF partagé est remis à l'application sur votre appareil : le service worker le conserve brièvement dans le cache local de votre navigateur, l'application le charge dans l'analyse puis l'y supprime. La remise reste sur votre appareil, il n'y a aucune transmission vers un serveur.",cb:"Presse-papiers, glisser-déposer",cbT:"Lorsque vous collez une image (Ctrl+V) ou glissez un fichier sur la page, elle est traitée uniquement dans votre navigateur et n'est pas transmise. XDC lit le presse-papiers uniquement au moment où vous collez vous-même, jamais en arrière-plan. « Image dans le presse-papiers » écrit le graphique terminé dans le presse-papiers de votre appareil uniquement à votre demande.",em:"E-mail",emT:"Si vous nous écrivez par e-mail, nous utilisons vos données uniquement pour traiter votre demande. Notre boîte aux lettres se trouve chez Google (Gmail, Google Ireland Ltd.). Des données peuvent alors être transférées vers les États-Unis, sur la base du EU-US Data Privacy Framework.",rights:"Vos droits",rightsT:"Accès, rectification, effacement, limitation, opposition et réclamation auprès d'une autorité de contrôle (art. 15 à 21, 77 RGPD). Contact : voir mentions légales.",back:"Retour à l'outil"},es:{mt:"Traducción automática, pendiente de revisión. Prevalece la versión alemana.",h:"Aviso legal y privacidad",imp:"Aviso legal",law:"Información según el § 5 DDG (ley alemana de servicios digitales)",contact:"Contacto",mail:"Correo electrónico",resp:"Responsable del contenido (§ 18 apdo. 2 MStV)",respT:"como arriba",odr:"Resolución de litigios",odrT:"No estamos obligados ni dispuestos a participar en procedimientos de resolución de litigios ante un organismo de arbitraje de consumo.",country:"Alemania",liab:"Nota sobre los resultados",liabT:"La herramienta digitaliza curvas a partir de fotos, capturas de pantalla y PDF. Los valores obtenidos son aproximaciones y dependen de la calidad de la imagen, la rectificación y la calibración. No sustituyen una medición en el banco de pruebas. Las marcas y denominaciones de los fabricantes de bancos de pruebas solo sirven para describir el formato de la impresión, no existe ninguna relación con los fabricantes.",ds:"Política de privacidad",ctrl:"Responsable del tratamiento",ctrlT:"véase el aviso legal.",host:"Alojamiento",hostT:"Este sitio está alojado en GitHub Pages (GitHub Inc., 88 Colin P. Kelly Jr. St., San Francisco, CA 94107, EE. UU.). Al acceder, GitHub trata datos técnicamente necesarios como la dirección IP, la hora, la página solicitada y el tipo de navegador en los registros del servidor. La base jurídica es nuestro interés legítimo en un funcionamiento seguro (art. 6 apdo. 1 letra f RGPD). La transferencia a EE. UU. se basa en el EU-US Data Privacy Framework, al que GitHub está adherido.",hostL:"Declaración de privacidad de GitHub",tool:"Herramienta",toolT:"Las fotos, capturas de pantalla y PDF que cargue o haga con la cámara se procesan exclusivamente en su navegador y no se transmiten a nosotros ni a terceros. Las curvas captadas, sus nombres y sus ajustes (unidad, vista, claro/oscuro, informe) se guardan localmente en su navegador (localStorage) para que sigan ahí la próxima vez. Para la comparación con el original, la imagen alineada se guarda localmente en su navegador (IndexedDB) y se elimina junto con sus curvas. No sale de su dispositivo. Para el uso sin conexión, el navegador guarda los archivos del programa en una caché local. Puede eliminar todos los datos en cualquier momento con «Eliminar todas las curvas» o en los ajustes del navegador. No se instalan cookies ni se usan servicios de análisis ni contenidos externos.",cam:"Cámara",camT:"La cámara solo se abre cuando toca «Hacer foto» y únicamente mediante la función de cámara de su dispositivo. La foto permanece en su dispositivo.",pf:"Archivo de proyecto",pfT:"«Guardar proyecto» crea un archivo (.xdc) con sus curvas, los nombres de las mediciones, los anclajes de los valores máximos y los ajustes del informe. Se crea en su navegador. Usted mismo lo guarda o lo envía con el menú de compartir de su dispositivo, adonde quiera. De forma predeterminada no contiene imágenes. Si elige «Con imágenes», se añaden las imágenes originales alineadas. Pueden mostrar datos de clientes, por lo que debe pasar el archivo solo si es correcto. «Abrir proyecto» lee un archivo así localmente en su navegador y comprueba antes su estructura, tamaño y contenido. No se transmite nada a nosotros ni a terceros y no se ejecuta ningún contenido del archivo.",sh:"Compartir con XDC",shT:"En los dispositivos que lo admiten (por ejemplo Android con la aplicación instalada), XDC aparece en el menú de compartir de otras aplicaciones. Una imagen o un PDF compartido se entrega a la aplicación en su dispositivo: el service worker lo guarda brevemente en la caché local de su navegador, la aplicación lo carga en el análisis y después lo elimina de allí. La entrega permanece en su dispositivo, no hay transmisión a ningún servidor.",cb:"Portapapeles, arrastrar y soltar",cbT:"Cuando pega una imagen (Ctrl+V) o arrastra un archivo a la página, se procesa solo en su navegador y no se transmite. XDC lee el portapapeles únicamente en el momento en que usted pega, nunca en segundo plano. «Imagen al portapapeles» escribe el diagrama terminado en el portapapeles de su dispositivo solo cuando usted lo pide.",em:"Correo electrónico",emT:"Si nos escribe por correo electrónico, usamos sus datos únicamente para tramitar su consulta. Nuestro buzón está en Google (Gmail, Google Ireland Ltd.). Los datos pueden transferirse a EE. UU., sobre la base del EU-US Data Privacy Framework.",rights:"Sus derechos",rightsT:"Acceso, rectificación, supresión, limitación, oposición y reclamación ante una autoridad de control (art. 15 a 21, 77 RGPD). Contacto: véase el aviso legal.",back:"Volver a la herramienta"}};function show(e){const a=T[e];document.documentElement.lang=e;try{localStorage.setItem("xdc.lang",e)}catch(e){}document.querySelectorAll("#lang button").forEach(a=>a.setAttribute("aria-pressed",a.dataset.l===e)),document.getElementById("h").textContent=a.h;const i=document.getElementById("mt");i.hidden=!a.mt,i.textContent=a.mt||"";const t=D("m"),n=document.createElement("a");n.href="mailto:"+t,n.textContent=t,document.getElementById("imp").innerHTML=`<h2>${a.imp}</h2><h3>${a.law}</h3><address>${D("f")}\
